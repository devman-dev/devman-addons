<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASADITO — Acceso Jugador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#050a18; --bg-mid:#08102b; --bg-card:rgba(5,10,28,0.75);
    --border:rgba(255,255,255,0.09); --border-focus:rgba(37,99,235,0.40);
    --primary:#2563eb; --primary-dim:#1d4ed8; --gold:#f2c451; --gold-dim:#b8912a;
    --crimson:#ff4d5e; --ink:#ffffff; --muted:#94a3b8;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{width:100%; height:100%; height:100dvh; overflow:hidden; font-family:'Inter',sans-serif;}
  body{
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1100px 700px at 50% 0%, rgba(37,99,235,0.09), transparent 60%),
      radial-gradient(800px 500px at 80% 90%, rgba(242,196,81,0.06), transparent 50%),
      repeating-linear-gradient(90deg, #08102b 0 80px, #0a1a30 80px 160px),
      linear-gradient(180deg, var(--bg-deep), #020c18);
    color:var(--ink);
  }
  @keyframes cardIn{from{opacity:0; transform:translateY(20px) scale(.97);} to{opacity:1; transform:none;}}
  @keyframes spin{from{transform:rotate(0)} to{transform:rotate(360deg);}}
  @keyframes shimmer{0%{transform:translateX(-100%)} 100%{transform:translateX(200%)}}

  .login-wrapper{width:min(420px,92vw); animation:cardIn .5s cubic-bezier(.2,.9,.25,1);}

  .brand{display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:4px;}
  .brand-logo{width:52px;height:52px;border-radius:50%; background:radial-gradient(circle at 35% 28%, #fff, #cfd8dc 48%, #0e1b2e 52%); box-shadow:0 0 28px rgba(37,99,235,0.35); animation:spin 7s linear infinite; flex:none;}
  .brand h1{font-family:'Anton'; font-size:42px; letter-spacing:.04em; background:linear-gradient(150deg, var(--ink), var(--gold) 55%, var(--gold-dim)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .brand h1 span{display:block; font-family:'Oswald'; font-size:13px; letter-spacing:.22em; color:var(--primary); font-weight:600; -webkit-text-fill-color:var(--primary);}
  .tagline{text-align:center; color:var(--muted); font-size:13px; margin:8px 0 22px;}

  .card{
    background:var(--bg-card); border:1.5px solid var(--border); border-radius:22px;
    padding:32px 26px; position:relative; overflow:hidden;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    box-shadow:0 24px 64px -6px rgba(0,0,0,0.45);
  }
  .card::before{content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, rgba(37,99,235,0.5), rgba(242,196,81,0.3), transparent);
  }

  .field{margin-bottom:16px; text-align:left;}
  .field label{display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:7px;}
  .field .input-wrap{position:relative; display:flex; align-items:center;}
  .field .input-wrap .ico{position:absolute; left:14px; font-size:16px; color:var(--muted); pointer-events:none;}
  .field input{
    width:100%; padding:14px 16px 14px 42px; border-radius:12px;
    border:1.5px solid var(--border); background:rgba(0,0,0,0.35); color:var(--ink);
    font-size:15px; font-family:'Inter'; transition:border-color .2s;
  }
  .field input:focus{outline:none; border-color:var(--border-focus);}
  .field input::placeholder{color:rgba(255,255,255,0.18);}

  .login-btn{
    width:100%; margin-top:8px; font-family:'Oswald'; font-weight:700; font-size:17px; letter-spacing:.04em;
    color:#03081a; background:linear-gradient(150deg, var(--primary), var(--primary-dim));
    border:none; border-radius:999px; padding:15px; cursor:pointer;
    box-shadow:0 14px 36px -8px rgba(37,99,235,0.45); transition:opacity .2s, transform .15s;
  }
  .login-btn:disabled{opacity:.45; cursor:not-allowed;}
  .login-btn:active:not(:disabled){transform:scale(.97);}
  .login-err{color:var(--crimson); font-size:12.5px; margin-top:12px; display:none; text-align:center;}

  .footer-bar{position:fixed; bottom:0; left:0; right:0; height:28px; background:rgba(4,10,7,0.7); border-top:1px solid var(--border); display:flex; align-items:center; justify-content:center; gap:16px; font-size:10.5px; color:var(--muted);}
  .footer-bar b{color:var(--gold);}

  @media (max-width:400px){
    .brand h1{font-size:34px;} .card{padding:24px 18px;}
  }
</style>
</head>
<body>

<div class="login-wrapper">
  <div class="brand">
    <div class="brand-logo"></div>
    <h1>ASADITO<span>CASINO</span></h1>
  </div>
  <p class="tagline">Portal de jugador — Ingresá con tu cuenta</p>

  <div class="card">
    <div class="field">
      <label>Email</label>
      <div class="input-wrap">
        <span class="ico">📧</span>
        <input type="email" id="loginEmail" placeholder="tu@email.com" autocomplete="email" autofocus>
      </div>
    </div>
    <div class="field">
      <label>Contraseña</label>
      <div class="input-wrap">
        <span class="ico">🔒</span>
        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
      </div>
    </div>
    <button class="login-btn" id="loginBtn" onclick="handleLogin()">Ingresar</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div class="footer-bar">
  <span>+18</span> <span>Jugá con responsabilidad</span> <span><b>0800-333-0333</b></span>
</div>

<script src="/casino/shared.js"></script>
<script>
// Si ya tiene sesión, redirigir directo al lobby
(function(){
  var s = getSession();
  if (s && s.uid) { window.location.replace(ODOO_BASE + '/casino'); return; }
})();

function handleLogin(){
  var email = el('loginEmail').value.trim();
  var pass  = el('loginPass').value.trim();
  if (!email || !pass) { el('loginErr').textContent = 'Completá email y contraseña'; el('loginErr').style.display='block'; return; }
  doLogin(email, pass, el('loginBtn'), el('loginErr'));
}

// Enter key
el('loginPass').addEventListener('keydown', function(e){ if(e.key==='Enter') handleLogin(); });
el('loginEmail').addEventListener('keydown', function(e){ if(e.key==='Enter') el('loginPass').focus(); });
</script>
</body>
</html>
